name: neobank
description: Enterprise-grade digital banking platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.0
  injectable: ^7.6.0

  # Networking
  dio: ^5.3.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^13.2.0

  # Utilities
  dartz: ^0.10.1
  freezed: ^2.4.1
  json_annotation: ^4.8.1

  # UI
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Testing
  mocktail: ^1.0.1
  bloc_test: ^9.1.5

  # Code Generation
  build_runner: ^2.4.6
  injectable_generator: ^7.6.0
  freezed_generator: ^2.4.1
  json_serializable: ^6.7.1

  # Linting
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
  - assets/images/
  - assets/icons/
  - assets/fonts/

  fonts:
  - family: Poppins
    fonts:
    - asset: assets/fonts/Poppins-Regular.ttf
    - asset: assets/fonts/Poppins-Medium.ttf
      weight: 500
    - asset: assets/fonts/Poppins-SemiBold.ttf
      weight: 600
    - asset: assets/fonts/Poppins-Bold.ttf
      weight: 700
